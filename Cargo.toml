[package]
name = "norenwake"
version = "0.9.0"
edition = "2021"

[dependencies]
anyhow = "1"
ansi-to-tui = "8.0.1"
arboard = "3"
cat-self-update-lib = { git = "https://github.com/cat2151/cat-self-update", rev = "e324426de0a3c219d1a63a939df93ff8f007916a", package = "cat-self-update-lib" }
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29"
dirs = "6"
ratatui = "0.30"
reqwest = { version = "0.13.2", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "local-offset", "macros"] }
toml = "1"
tui-markdown = "0.3.6"
